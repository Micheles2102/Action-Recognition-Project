<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness AI Analyzer</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="api.js"></script>
</head>
<body>
  
  <div class="app-layout">
    
    <!-- SIDEBAR: Selezione Modello -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <svg class="icon-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
        </svg>
        <h3>Modelli AI</h3>
      </div>
      
      <nav class="model-nav">
        <button class="nav-btn active" data-model="hybrid">
          <span>Modello Ibrido</span>
          <small>(CNN + TCN Ensemble)</small>
        </button>
        <button class="nav-btn" data-model="cnn">
          <span>Solo CNN</span>
          <small>(PyTorch V5)</small>
        </button>
        <button class="nav-btn" data-model="tcn">
          <span>Solo TCN</span>
          <small>(Temporale)</small>
        </button>
      </nav>
  
      <div class="server-status-mini">
        <div id="status-indicator" class="status-indicator"></div>
        <span id="status-text">Check Server...</span>
      </div>
    </aside>
  
    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="app-header">
        <h1>Fitness AI Analyzer</h1>
        <p class="header-subtitle">Carica il video e scegli il modello per l'analisi</p>
      </header>
  
      <!-- Upload Area -->
      <div id="upload-area" class="upload-area">
        <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
        </svg>
        <p class="upload-title">Carica il tuo video di allenamento</p>
        <button id="select-video-btn" class="btn-primary">Seleziona Video</button>
      </div>
  
      <!-- Video Container -->
      <div id="video-container" class="video-section" style="display: none;">
        <div id="video-player-wrapper" class="video-wrapper">
          <video id="video-player" controls></video>
        </div>
        
        <div class="action-buttons">
          <button id="change-video-btn" class="btn-secondary">Cambia Video</button>
          <button id="analyze-btn" class="btn-primary">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
            </svg>
            <span>Analizza Esercizio</span>
          </button>
        </div>
      </div>
  
      <!-- Results Section -->
      <div id="result-section" class="results-section" style="display: none;">
        <div class="result-card">
          <div class="card-header">
            <svg class="icon-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <h2>Esercizio Rilevato</h2>
          </div>
          <div class="exercise-display">
            <div id="exercise-label" class="exercise-label"></div>
          </div>
        </div>
  
        <!-- Metrics -->
        <div class="result-card">
          <h2 class="card-title">Metriche <span id="model-badge" style="font-size: 0.6em; opacity: 0.7; margin-left: 10px;"></span></h2>
          <div id="metrics-grid" class="metrics-grid"></div>
        </div>
      </div>
    </main>
    
  </div> <!-- Fine app-layout -->

  <script src="renderer.js"></script>
</body>
</html>
